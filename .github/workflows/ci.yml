name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos-smoke:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Compile source
        run: |
          python -m py_compile app.py db.py engine.py i18n.py installer.py
      - name: Import and UI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from installer import mac_profile, format_bytes
          from db import init_db
          from app import MainWindow
          init_db()
          app = QApplication([])
          w = MainWindow()
          assert w.table.columnCount() == 10
          assert w.compat_filter.findData("oneclick") >= 0
          print("Mac:", mac_profile())
          print("Rows:", w.table.rowCount())
          print("Free:", format_bytes(mac_profile()["free_bytes"]))
          w.close()
          app.quit()
          PY
